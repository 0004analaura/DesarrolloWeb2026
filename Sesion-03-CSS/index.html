<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Productos — Tarea CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Galería de Productos Tecnológicos</h1>
    </header>

    <main class="container">

        <section class="galeria">

            <article class="producto">
                <img src="920-009388-LOGITECH-1200x1200-2-1-526x526.jpg" alt="Teclado mecánico Logitech con luces RGB">
                <div class="producto-info">
                    <h2>Teclado mecánico</h2>
                    <p class="precio">Q350.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="CLA100-SMARTEC-MOUSE-1200X1200-1-1-526x526.-500x500.jpg" alt="Mouse inalámbrico negro con luces RGB">
                <div class="producto-info">
                    <h2>Mouse inalámbrico</h2>
                    <p class="precio">Q150.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="images.jpg" alt="Audífonos gaming negros con detalles azules">
                <div class="producto-info">
                    <h2>Audífonos</h2>
                    <p class="precio">Q280.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="69666-XIAOMI-1200x1200-01.-300x300.jpg" alt="Monitor de computadora con bordes delgados">
                <div class="producto-info">
                    <h2>Monitor</h2>
                    <p class="precio">Q900.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="images%20(1).jpg" alt="Memoria USB Kingston de 128 GB color rosa">
                <div class="producto-info">
                    <h2>Memoria USB</h2>
                    <p class="precio">Q75.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="960-001087%20(7)-250x250.jpg" alt="Cámara web Logitech HD 1080p">
                <div class="producto-info">
                    <h2>Cámara web</h2>
                    <p class="precio">Q220.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

        </section>

    </main>

    <footer>
        <p>Universidad Mariano Gálvez de Guatemala — Desarrollo Web Sesión 3</p>
    </footer>

</body>
</html>
